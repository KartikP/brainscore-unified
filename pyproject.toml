################################################################
#### project metadata (PEP 621) ####
################################################################

[project]
name = "brainscore"
version = "0.2.0"
description = "Unified Brain-Score model interface: register a model once and score it across vision, language, audio, video, multimodal, perturbation, and embodied benchmarks."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Kartik Pradeepan" }]
keywords = [
    "brain-score",
    "neuroai",
    "model-interface",
    "benchmarking",
    "computational-neuroscience",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

# Direct dependencies. The three domain packages pull in the model-extraction
# and scoring stack (torch, transformers, sklearn, ...). The version constraints
# below are the HARD pins this codebase depends on — encoded here (not just in
# tribal docs) so a clean clone reproduces. They are deliberately conservative
# upper/lower bounds, not exact pins, to stay compatible with the domain repos'
# own resolutions.
#
# NOTE ON scikit-learn: vision needs <1.6, language needs >=1.6. They cannot be
# co-pinned. Install the one matching the domain you score; the env used for
# development pins 1.5.x and skips the language tests that require >=1.6. This is
# a known, documented conflict — see the repo notes.
dependencies = [
    "brainscore_core",
    "brainscore_vision",
    "brainscore_language",
    "numpy<2",
    "xarray==2022.3.0",
    "pandas<3",
    "scipy",
    "transformers<5",
    "importlib-metadata<5",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-check",
    "pytest-mock",
]

[project.urls]
Homepage = "https://github.com/KartikP/brainscore-unified"
Repository = "https://github.com/KartikP/brainscore-unified"

################################################################
#### build backend ####
################################################################

[build-system]
requires = ["setuptools>=65,<69", "wheel"]
build-backend = "setuptools.build_meta"

################################################################
#### packaging: ship the package, not tests/scripts/notebooks ####
################################################################

[tool.setuptools.packages.find]
include = ["brainscore*"]
exclude = ["tests*", "scripts*", "notebooks*"]

################################################################
#### pytest config ####
################################################################

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (slow, requires real components)",
    "unit: marks tests as unit tests (fast, isolated)",
    "slow: marks tests as slow running tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# templates/ holds fill-me-in scaffolds (Ellipsis/TODO placeholders), not real
# tests — they can't pass until copied + completed, so keep them out of the suite.
norecursedirs = ["templates"]
console_output_style = "progress"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::FutureWarning:brainscore_core.metrics*",
]
