# Brain-Score UMI pinned environment.
#
# IMPORTANT — this file must SIT BESIDE the four repositories to work. The `-e ./core`
# entries at the bottom are relative, and conda runs its pip step with the working
# directory set to *this file's* directory — not to wherever you invoke conda. So
# `conda env create -f unified/install/environment-unified.yml` fails even from the
# workspace root, with:
#
#     ERROR: ./core is not a valid editable requirement.
#
# If you already have the four repositories, copy this file next to them first:
#
#     cd <workspace-root>          # holds core/ vision/ language/ unified/
#     cp unified/install/environment-unified.yml .
#     conda env create -n brainscore-unified -f environment-unified.yml
#
# On a machine with no checkout, use install/setup.sh instead — it downloads this file
# into the workspace root before creating the environment, which is why the bootstrap
# path never hits this. See install/README.md.

name: brainscore-unified
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24
  - pip:
      # Exact shared-environment versions tested by the UMI distribution.
      - numpy==1.26.4
      - xarray==2022.3.0
      - scikit-learn==1.7.2
      - transformers==4.57.6
      - importlib-metadata==4.13.0
      # Language data loading (e.g. wikitext) imports `datasets`; without it the
      # language data path ModuleNotFoundErrors.
      - datasets==5.0.0
      # Test runner, so the documented `pytest tests/` commands work on a fresh env.
      - pytest
      # Install every sibling repository from this checkout.
      - -e ./core
      - -e ./vision
      - -e ./language
      - -e ./unified[notebooks]
