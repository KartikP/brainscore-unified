name: brainscore-unified
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24
  - pip:
      # Exact shared-environment versions tested by the UMI distribution.
      - numpy==1.26.4
      - xarray==2022.3.0
      - scikit-learn==1.5.1
      - transformers==4.57.6
      - importlib-metadata==4.13.0
      # Language data loading (e.g. wikitext) imports `datasets`; without it the
      # language data path ModuleNotFoundErrors.
      - datasets==5.0.0
      # Test runner, so the documented `pytest tests/` commands work on a fresh env.
      - pytest
      # Install every sibling repository from this checkout.
      - -e ./core
      - -e ./vision
      - -e ./language
      - -e ./unified[notebooks]
