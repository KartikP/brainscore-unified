# Brain-Score UMI pinned environment.
#
# IMPORTANT — run this from the WORKSPACE ROOT, the directory that holds core/,
# vision/, language/ and unified/ side by side:
#
#     conda env create -n brainscore-unified -f unified/install/environment-unified.yml
#
# The `-e ./core` entries at the bottom are relative paths. From anywhere else --
# including from unified/install/ where this file lives in the repository -- they
# resolve to directories that do not exist, and pip fails with four confusing
# "path does not exist" errors.
#
# On a machine with no checkout yet, prefer install/setup.sh: it clones the four
# repositories, copies this file to the workspace root, and creates the environment
# with the paths already correct. See install/README.md.

name: brainscore-unified
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24
  - pip:
      # Exact shared-environment versions tested by the UMI distribution.
      - numpy==1.26.4
      - xarray==2022.3.0
      - scikit-learn==1.5.1
      - transformers==4.57.6
      - importlib-metadata==4.13.0
      # Language data loading (e.g. wikitext) imports `datasets`; without it the
      # language data path ModuleNotFoundErrors.
      - datasets==5.0.0
      # Test runner, so the documented `pytest tests/` commands work on a fresh env.
      - pytest
      # Install every sibling repository from this checkout.
      - -e ./core
      - -e ./vision
      - -e ./language
      - -e ./unified[notebooks]
