[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umi-partner-tool-example"
version = "0.1.0"
description = "Independent UMI capability and observer example"
requires-python = ">=3.11,<3.12"
dependencies = ["brainscore==0.3.0rc1", "numpy<2"]

[tool.setuptools.packages.find]
where = ["src"]
