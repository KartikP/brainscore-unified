name: pin agreement
# Check this unified revision's lock (install/peer-revisions.json): each entry
# is a commit of the peer's release branch with the code of the peer source
# (default: their unified-model-interface-v2 tips), and the infrastructure
# Jenkins scripts fetch the unified release branch. A script that cannot be read
# (it needs UMI_PIN_READ_TOKEN) is a warning.
on:
  push:
    branches: [unified-model-interface-v2]
  pull_request:
  workflow_dispatch:
    inputs:
      core:
        description: core ref (SHA or branch)
        required: false
        default: unified-model-interface-v2
      vision:
        description: vision ref (SHA or branch)
        required: false
        default: unified-model-interface-v2
      language:
        description: language ref (SHA or branch)
        required: false
        default: unified-model-interface-v2
permissions:
  contents: read
jobs:
  pins:
    name: Pin agreement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: unified
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the lock and the scripts that read it
        env:
          GH_TOKEN: ${{ secrets.UMI_PIN_READ_TOKEN || github.token }}
          CORE_REF: ${{ github.event.inputs.core || 'unified-model-interface-v2' }}
          VISION_REF: ${{ github.event.inputs.vision || 'unified-model-interface-v2' }}
          LANGUAGE_REF: ${{ github.event.inputs.language || 'unified-model-interface-v2' }}
        run: |
          python -I unified/install/check_pins.py --unified unified \
            --core "$CORE_REF" --vision "$VISION_REF" --language "$LANGUAGE_REF"
