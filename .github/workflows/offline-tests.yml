name: offline tests
# Every step after the checkouts runs install/run_candidate.sh. A development
# machine runs the same script with "all"; keep the commands in the script.
# Per pull request: ubuntu tests and the OpenPI jobs. The macOS legs, the
# qualification tests and the examples run on push to v2, on workflow_dispatch
# (the nightly-v2 workflow dispatches it), and on pull requests that carry the
# run-macos label. Skipped jobs report success, so required checks stay green.
on:
  push:
    branches: [unified-model-interface-v2]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      core_revision:
        description: Optional core candidate as full SHA or owner/repo@full-SHA (default is the pin)
        required: false
        type: string
      vision_revision:
        description: Optional vision candidate as full SHA or owner/repo@full-SHA (default is the pin)
        required: false
        type: string
      language_revision:
        description: Optional language candidate as full SHA or owner/repo@full-SHA (default is the pin)
        required: false
        type: string
  workflow_call:
    inputs:
      candidate:
        description: Repository under test (core, vision or language)
        required: true
        type: string
      candidate_repository:
        description: GitHub repository containing the candidate, including forks
        required: true
        type: string
      candidate_revision:
        description: Exact PR head or pushed commit
        required: true
        type: string
      unified_revision:
        description: Immutable Unified revision supplying the runner and peer pins
        required: true
        type: string
concurrency:
  group: umi-installed-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RESULTCACHING_DISABLE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      BS_INSTALL_DEPENDENCIES: 'no'
      UMI_TEST_CPU_ONLY: '1'
    steps:
      - name: Decide whether this job has work
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CALLER: ${{ inputs.candidate }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-macos')) && '1' || '0' }}
          RUNNER: ${{ runner.os }}
        run: |
          # macOS legs run only in a full run. A skipped leg still reports success.
          skip=false
          if [ "$RUNNER" = macOS ] && [ "$FULL" != 1 ]; then
            skip=true
          fi
          if [ "$EVENT" = pull_request ] && [ -z "$CALLER" ]; then
            files=$(gh api "repos/$REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq '.files[].filename' || true)
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          repository: ${{ inputs.unified_revision && 'KartikP/brainscore-unified' || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.unified_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: unified
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: unified/install/v2-constraints.txt
      - name: Resolve exact candidate and pinned peers
        if: steps.scope.outputs.skip != 'true'
        id: peers
        env:
          CANDIDATE: ${{ inputs.candidate || 'unified' }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.event.pull_request.head.sha || github.sha }}
          UNIFIED_REPOSITORY: ${{ inputs.unified_revision && 'KartikP/brainscore-unified' || github.event.pull_request.head.repo.full_name || github.repository }}
          OVERRIDE_CORE: ${{ github.event.inputs.core_revision }}
          OVERRIDE_VISION: ${{ github.event.inputs.vision_revision }}
          OVERRIDE_LANGUAGE: ${{ github.event.inputs.language_revision }}
        run: bash unified/install/run_candidate.sh --work "$GITHUB_WORKSPACE" resolve
      - uses: actions/checkout@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          repository: ${{ steps.peers.outputs.core_repository }}
          ref: ${{ steps.peers.outputs.core_revision }}
          persist-credentials: false
          path: core
      - uses: actions/checkout@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          repository: ${{ steps.peers.outputs.vision_repository }}
          ref: ${{ steps.peers.outputs.vision_revision }}
          persist-credentials: false
          path: vision
      - uses: actions/checkout@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          repository: ${{ steps.peers.outputs.language_repository }}
          ref: ${{ steps.peers.outputs.language_revision }}
          persist-credentials: false
          path: language
      - name: Verify checkout revisions before building
        if: steps.scope.outputs.skip != 'true'
        run: bash unified/install/run_candidate.sh --work "$GITHUB_WORKSPACE" verify
      - name: Build all four wheels
        if: steps.scope.outputs.skip != 'true'
        run: bash unified/install/run_candidate.sh --work "$GITHUB_WORKSPACE" build
      - name: Check package contents and notices
        if: steps.scope.outputs.skip != 'true'
        run: bash unified/install/run_candidate.sh --work "$GITHUB_WORKSPACE" contents
      - name: Build the independent example package
        if: steps.scope.outputs.skip != 'true'
        run: bash unified/install/run_candidate.sh --work "$GITHUB_WORKSPACE" example
      - name: Install CPU Torch on Linux
        if: (runner.os == 'Linux') && steps.scope.outputs.skip != 'true'
        run: bash unified/install/run_candidate.sh --work "$GITHUB_WORKSPACE" torch
      - name: Install ffmpeg
        if: steps.scope.outputs.skip != 'true'
        run: bash unified/install/run_candidate.sh --work "$GITHUB_WORKSPACE" ffmpeg
      - name: Install coordinated packages
        if: steps.scope.outputs.skip != 'true'
        run: bash unified/install/run_candidate.sh --work "$GITHUB_WORKSPACE" install
      - name: Verify installed packages outside source
        if: steps.scope.outputs.skip != 'true'
        run: bash unified/install/run_candidate.sh --work "$GITHUB_WORKSPACE" installed-checks
      - name: Test the four installed packages
        if: steps.scope.outputs.skip != 'true'
        env:
          UMI_FULL: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-macos')) && '1' || '0' }}
        run: bash unified/install/run_candidate.sh --work "$GITHUB_WORKSPACE" packages
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.skip != 'true'
        with:
          name: v2-integration-${{ matrix.os }}
          path: |
            wheels
            example-wheels
            qualification
            resolved-dependencies.txt
            unified/install/peer-revisions.json
            ${{ runner.temp }}/partner-demo
            ${{ runner.temp }}/external-tool-demo
            ${{ runner.temp }}/installed-examples
