name: offline tests
on:
  push:
    branches: [unified-model-interface-v2]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RESULTCACHING_DISABLE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      BS_INSTALL_DEPENDENCIES: 'no'
      UMI_TEST_CPU_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: unified
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read immutable peer revisions
        id: peers
        run: |
          python - <<'PY'
          import json, os, re
          peers = json.load(open('unified/install/peer-revisions.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('core', 'vision', 'language'):
                  revision = peers[name]
                  if not re.fullmatch('[0-9a-f]{40}', revision):
                      raise ValueError(f'Invalid revision for {name}')
                  print(f'{name}={revision}', file=output)
          PY
      - uses: actions/checkout@v4
        with:
          repository: brain-score/core
          ref: ${{ steps.peers.outputs.core }}
          path: core
      - uses: actions/checkout@v4
        with:
          repository: brain-score/vision
          ref: ${{ steps.peers.outputs.vision }}
          path: vision
      - uses: actions/checkout@v4
        with:
          repository: brain-score/language
          ref: ${{ steps.peers.outputs.language }}
          path: language
      - name: Build all four wheels
        run: |
          python -m pip install build setuptools==68.2.2 wheel
          for repo in core vision language unified; do
            python -m build --wheel --no-isolation --outdir wheels "$repo"
          done
      - name: Install CPU Torch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install coordinated packages
        run: |
          python -m pip install -c unified/install/v2-constraints.txt wheels/*.whl pytest pytest-check pytest-mock pytest-timeout matplotlib
          python -m pip check
          python -m pip freeze > resolved-dependencies.txt
          python -m pip install --no-deps ./unified/examples/partner_tool
      - name: Verify installed packages outside source
        working-directory: ${{ runner.temp }}
        run: |
          python -m brainscore.doctor
          python "$GITHUB_WORKSPACE/unified/examples/partner_integration.py" --out "$RUNNER_TEMP/partner-demo"
          python -m umi_partner_tool --out "$RUNNER_TEMP/external-tool-demo"
          python -m pytest "$GITHUB_WORKSPACE/unified/tests/test_production_tools.py" "$GITHUB_WORKSPACE/unified/tests/test_droid_policy.py" -q --import-mode=importlib -p no:cacheprovider
      - name: Test the four source trees
        run: python -m brainscore.validation.workspace --root . --out qualification/source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-integration-${{ matrix.os }}
          path: |
            wheels
            qualification
            resolved-dependencies.txt
            unified/install/peer-revisions.json
            ${{ runner.temp }}/partner-demo
            ${{ runner.temp }}/external-tool-demo
