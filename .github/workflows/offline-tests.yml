name: offline tests
on:
  push:
    branches: [unified-model-interface-v2]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        description: Repository under test (core, vision or language)
        required: true
        type: string
      candidate_repository:
        description: GitHub repository containing the candidate, including forks
        required: true
        type: string
      candidate_revision:
        description: Exact PR head or pushed commit
        required: true
        type: string
      unified_revision:
        description: Immutable Unified revision supplying the runner and peer pins
        required: true
        type: string
concurrency:
  group: umi-installed-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RESULTCACHING_DISABLE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      BS_INSTALL_DEPENDENCIES: 'no'
      UMI_TEST_CPU_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.unified_revision && 'KartikP/brainscore-unified' || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.unified_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: unified
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve exact candidate and pinned peers
        id: peers
        env:
          CANDIDATE: ${{ inputs.candidate || 'unified' }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.event.pull_request.head.sha || github.sha }}
          UNIFIED_REPOSITORY: ${{ inputs.unified_revision && 'KartikP/brainscore-unified' || github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          export UNIFIED_REVISION=$(git -C unified rev-parse HEAD)
          python unified/brainscore/validation/revisions.py \
            --manifest unified/install/peer-revisions.json \
            --record qualification/revisions.json
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.peers.outputs.core_repository }}
          ref: ${{ steps.peers.outputs.core_revision }}
          persist-credentials: false
          path: core
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.peers.outputs.vision_repository }}
          ref: ${{ steps.peers.outputs.vision_revision }}
          persist-credentials: false
          path: vision
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.peers.outputs.language_repository }}
          ref: ${{ steps.peers.outputs.language_revision }}
          persist-credentials: false
          path: language
      - name: Verify checkout revisions before building
        run: python unified/brainscore/validation/revisions.py --record qualification/revisions.json --verify
      - name: Build all four wheels
        run: |
          python -m pip install build setuptools==68.2.2 wheel
          for repo in core vision language unified; do
            python -m build --wheel --no-isolation --outdir wheels "$repo"
          done
      - name: Install CPU Torch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install coordinated packages
        run: |
          unified_wheels=(wheels/brainscore-*.whl)
          python -m pip install -c unified/install/v2-constraints.txt wheels/*.whl "${unified_wheels[0]}[test]"
          python -m pip check
          python -m pip freeze > resolved-dependencies.txt
          python -m pip install --no-deps ./unified/examples/partner_tool
      - name: Verify installed packages outside source
        working-directory: ${{ runner.temp }}
        run: |
          python -m brainscore.doctor
          python "$GITHUB_WORKSPACE/unified/examples/partner_integration.py" --out "$RUNNER_TEMP/partner-demo"
          python -m umi_partner_tool --out "$RUNNER_TEMP/external-tool-demo"
          python -m pytest "$GITHUB_WORKSPACE/unified/tests/test_production_tools.py" "$GITHUB_WORKSPACE/unified/tests/test_droid_policy.py" -q --import-mode=importlib -p no:cacheprovider
      - name: Test the four installed packages
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m brainscore.validation.workspace \
            --root "$GITHUB_WORKSPACE" \
            --mode installed --wheels "$GITHUB_WORKSPACE/wheels" \
            --out "$GITHUB_WORKSPACE/qualification/installed.json"
      - name: Execute offline tutorials against installed packages
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m brainscore.validation.notebooks \
            --source "$GITHUB_WORKSPACE/unified/notebooks" \
            --out "$GITHUB_WORKSPACE/qualification/notebooks" --timeout 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-integration-${{ matrix.os }}
          path: |
            wheels
            qualification
            resolved-dependencies.txt
            unified/install/peer-revisions.json
            ${{ runner.temp }}/partner-demo
            ${{ runner.temp }}/external-tool-demo
  openpi-client:
    name: OpenPI client protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RESULTCACHING_DISABLE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      BS_INSTALL_DEPENDENCIES: 'no'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.unified_revision && 'KartikP/brainscore-unified' || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.unified_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: unified
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve exact candidate and pinned peers
        id: peers
        env:
          CANDIDATE: ${{ inputs.candidate || 'unified' }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.event.pull_request.head.sha || github.sha }}
          UNIFIED_REPOSITORY: ${{ inputs.unified_revision && 'KartikP/brainscore-unified' || github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          export UNIFIED_REVISION=$(git -C unified rev-parse HEAD)
          python unified/brainscore/validation/revisions.py \
            --manifest unified/install/peer-revisions.json \
            --record qualification/revisions.json
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.peers.outputs.core_repository }}
          ref: ${{ steps.peers.outputs.core_revision }}
          persist-credentials: false
          path: core
      - name: Verify checkout revisions before installing
        run: python unified/brainscore/validation/revisions.py --record qualification/revisions.json --verify core unified
      - name: Install client test environment
        run: |
          python -m pip install -c unified/install/v2-constraints.txt ./core -r unified/install/openpi-client-tests.txt
          python -m pip check
      - name: Record environment and revisions
        if: always()
        run: |
          mkdir -p qualification
          python -m pip freeze > qualification/dependencies.txt
          git -C unified rev-parse HEAD > qualification/unified-revision.txt
          git -C core rev-parse HEAD > qualification/core-revision.txt
      - name: Require every client protocol test
        working-directory: unified
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/unified:${{ github.workspace }}/core
        run: |
          python -m pytest tests/test_openpi_remote.py -q -ra \
            -p no:cacheprovider -p brainscore.validation.required_checks \
            --umi-repository openpi-client \
            --umi-check-report ../qualification/openpi-client.json \
            --junitxml=../qualification/openpi-client.xml --timeout=30 \
            2>&1 | tee ../qualification/openpi-client.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openpi-client-protocol
          path: |
            qualification
            unified/install/openpi-client-tests.txt
            unified/install/v2-constraints.txt
            unified/install/peer-revisions.json
  openpi-instrumentation:
    name: OpenPI local instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RESULTCACHING_DISABLE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      BS_INSTALL_DEPENDENCIES: 'no'
      JAX_PLATFORMS: cpu
      UMI_TEST_CPU_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.unified_revision && 'KartikP/brainscore-unified' || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.unified_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: unified
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve exact candidate and pinned peers
        id: peers
        env:
          CANDIDATE: ${{ inputs.candidate || 'unified' }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.event.pull_request.head.sha || github.sha }}
          UNIFIED_REPOSITORY: ${{ inputs.unified_revision && 'KartikP/brainscore-unified' || github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          export UNIFIED_REVISION=$(git -C unified rev-parse HEAD)
          python unified/brainscore/validation/revisions.py \
            --manifest unified/install/peer-revisions.json \
            --record qualification/revisions.json
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.peers.outputs.core_repository }}
          ref: ${{ steps.peers.outputs.core_revision }}
          persist-credentials: false
          path: core
      - name: Verify checkout revisions before installing
        run: python unified/brainscore/validation/revisions.py --record qualification/revisions.json --verify core unified
      - uses: actions/checkout@v4
        with:
          repository: Physical-Intelligence/openpi
          ref: 215abfb217dbac7d5f1273282331b9b1866c0479
          persist-credentials: false
          path: openpi
      - name: Install CPU Torch
        run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install local instrumentation environment
        run: |
          python -m pip install -c unified/install/v2-constraints.txt ./core -r unified/install/openpi-instrumentation-tests.txt
          python -m pip check
      - name: Record environment and revisions
        if: always()
        run: |
          mkdir -p qualification
          python -m pip freeze > qualification/dependencies.txt
          git -C unified rev-parse HEAD > qualification/unified-revision.txt
          git -C core rev-parse HEAD > qualification/core-revision.txt
          git -C openpi rev-parse HEAD > qualification/openpi-revision.txt
      - name: Require every local instrumentation and transport test
        working-directory: unified
        shell: bash
        env:
          OPENPI_SOURCE: ${{ github.workspace }}/openpi
          PYTHONPATH: ${{ github.workspace }}/unified:${{ github.workspace }}/core
        run: |
          python -m pytest tests/test_openpi_instrumentation.py tests/test_libero_transport.py -q -ra \
            -p no:cacheprovider -p brainscore.validation.required_checks \
            --umi-repository openpi-instrumentation \
            --umi-check-report ../qualification/openpi-instrumentation.json \
            --junitxml=../qualification/openpi-instrumentation.xml --timeout=120 \
            2>&1 | tee ../qualification/openpi-instrumentation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openpi-local-instrumentation
          path: |
            qualification
            unified/install/openpi-instrumentation-tests.txt
            unified/install/openpi-client-tests.txt
            unified/install/v2-constraints.txt
            unified/install/peer-revisions.json
